name: Post to Blogger

# ------------------------------------------------------------------
# SCHEDULE
# The cron value below is UTC. GitHub Actions cron is UTC-only, always.
#
#   UTC        IST (India, UTC+5:30)     Cron
#   00:00      05:30                      '0 0 * * *'
#   06:00      11:30                      '0 6 * * *'
#   10:30      16:00                      '30 10 * * *'
#   14:00      19:30                      '0 14 * * *'
#
# Format: minute hour day-of-month month day-of-week
#   '0 6 * * *'   = every day at 06:00 UTC
#   '0 6 * * 1-5' = Monday to Friday at 06:00 UTC
#   '30 6 * * 0'  = Sundays only at 06:30 UTC
#
# Note: GitHub sometimes starts scheduled runs up to ~15 minutes late
# during busy periods. That is normal and not a misconfiguration.
# ------------------------------------------------------------------
on:
  schedule:
    - cron: '0 6 * * *'
  # Lets you trigger a run by hand from the Actions tab.
  workflow_dispatch:

# Never let two runs publish at the same time.
concurrency:
  group: blogger-post
  cancel-in-progress: false

permissions:
  contents: write # needed to commit the updated post history

defaults:
  run:
    working-directory: blogger-agent

jobs:
  publish:
    name: Generate and publish one post
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Blogger credentials
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: node src/index.js --verify

      - name: Generate and publish post
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: node src/index.js

      - name: Commit updated post history
        # Without this step the topic history would reset on every run,
        # because each workflow run starts from a fresh checkout.
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add logs/published.json
          if git diff --staged --quiet; then
            echo 'No history changes to commit.'
          else
            git commit -m 'chore(blog): record published post'
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi
