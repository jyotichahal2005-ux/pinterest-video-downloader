openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: downloads
    description: Pinterest media extraction operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /download:
    post:
      operationId: downloadPinterestVideo
      tags: [downloads]
      summary: Extract downloadable videos from a Pinterest pin
      description: Resolves Pinterest short links, fetches the pin page, and extracts available direct MP4 video URLs and metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadInput"
      responses:
        "200":
          description: Pinterest video metadata and quality options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadResult"
        "400":
          description: Invalid URL or no video found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Pinterest could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DownloadInput:
      type: object
      properties:
        url:
          type: string
          format: uri
          minLength: 1
      required:
        - url
    DownloadVideo:
      type: object
      properties:
        url:
          type: string
          format: uri
        label:
          type: string
      required:
        - url
        - label
    DownloadResult:
      type: object
      properties:
        title:
          type: string
        thumbnail:
          type: ["string", "null"]
          format: uri
        videos:
          type: array
          items:
            $ref: "#/components/schemas/DownloadVideo"
      required:
        - title
        - thumbnail
        - videos
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

